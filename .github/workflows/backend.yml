# References for set up
# https://docs.github.com/en/actions/tutorials/build-and-test-code/java-with-maven
# https://docs.github.com/en/actions/tutorials/use-containerized-services/create-postgresql-service-containers
# https://docs.github.com/en/actions/tutorials/store-and-share-data

name: Backend CI

# When the pipeline starts
on:
  push:
    branches: [main] # code is pushed to main
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request: # pull request is opened or updated
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs: # build and test job
  build-and-test:
    runs-on: ubuntu-latest

    # start a temp postgreSQL database
    services:
      postgres:
        image: postgres:16
        env:
          # set db variables
          POSTGRES_DB: manga_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432 # map the port to the localhost, check every 5s, up to 10 times
        # wait till pg_isready
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # deault directory
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        # java maven 17 and restore dependencies
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
        # build the project, set variables
      - name: Build and test
        run: mvn -B verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/manga_test
          SPRING_DATASOURCE_USERNAME: test
          SPRING_DATASOURCE_PASSWORD: test

        # save results
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: backend/target/surefire-reports
        # save app, only if sucessfull
      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          if-no-files-found: error